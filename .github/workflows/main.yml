name: Lotto Auto Bot

on:
  schedule:
    # UTC 기준 03:00 = 한국 시간 12:00 (월요일 1, 일요일 0)
    - cron: '0 3 * * 1,0'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (auto: 요일별 자동판단 / gen: 번호생성 / check: 당첨확인 및 이력업데이트)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - gen
          - check

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 필수 라이브러리 설치
      run: |
        pip install -r requirements.txt

    # 결과값: 1(월) ~ 6(토) ~ 7(일)
    - name: 요일 확인 (한국시간 기준)
      run: |
        echo "DAY_OF_WEEK=$(TZ='Asia/Seoul' date +%u)" >> $GITHUB_ENV

    - name: 구글 인증키 파일 생성
      run: |
        echo '${{ secrets.GOOGLE_JSON_KEY }}' > lotto_key.json

    - name: 번호 생성 실행 (--mode gen)
      if: github.event.inputs.mode == 'gen' || (github.event.inputs.mode != 'check' && env.DAY_OF_WEEK != '7')
      run: |
        python file2_lotto_service.py --mode gen

    - name: 당첨 확인 및 이력 업데이트 (--mode check)
      if: github.event.inputs.mode == 'check' || (github.event.inputs.mode != 'gen' && env.DAY_OF_WEEK == '7')
      run: |
        python file1_history_manager.py
        python file2_lotto_service.py --mode check

    - name: 결과 파일 저장 (Commit & Push)
      run: |
        git config --global user.name "lotto-bot"
        git config --global user.email "bot@noreply.github.com"
        
        # 1. 보안을 위해 키 파일 먼저 삭제 (로그에 남지 않게)
        rm -f lotto_key.json
        
        # 2. 변경된 데이터 추가
        git add *.json *.csv
        
        # 3. 커밋
        git commit -m "Update lotto data" || echo "No changes to commit"
        
        # 4. 서버의 최신 변경사항을 가져와서 합치기
        git pull --rebase origin main
        
        # 5. 최종 푸시
        git push
