name: Lotto Auto Bot

on:
  schedule:
    # UTC 03:15 = 한국시간(KST) 12:15
    # 정각(:00) 트래픽 몰림으로 인한 깃허브 실행 지연을 방지하기 위해 15분에 설정
    - cron: '15 3 * * 0,1'
  workflow_dispatch:
    inputs:
      mode:
        description: '수동 실행 모드 (auto: 요일 자동판단 / gen: 월요일 번호생성 / check: 일요일 당첨확인)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - gen
          - check

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 파이썬 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 필수 라이브러리 설치
      run: |
        pip install -r requirements.txt

    # 결과값: 1(월) ~ 6(토) ~ 7(일)
    - name: 요일 확인 (한국시간 기준)
      run: |
        echo "DAY_OF_WEEK=$(TZ='Asia/Seoul' date +%u)" >> $GITHUB_ENV

    - name: 구글 인증키 파일 생성
      run: |
        echo '${{ secrets.GOOGLE_JSON_KEY }}' > lotto_key.json

    - name: "일요일 - 토요일 당첨 결과 수집 및 당첨 확인"
      if: github.event.inputs.mode == 'check' || ((github.event.inputs.mode == 'auto' || github.event_name == 'schedule') && env.DAY_OF_WEEK == '7')
      run: |
        python file1_history_manager.py
        python file2_lotto_service.py --mode check

    - name: "월요일 - 조건 맞춘 새로운 로또 번호 자동 생성"
      if: github.event.inputs.mode == 'gen' || ((github.event.inputs.mode == 'auto' || github.event_name == 'schedule') && env.DAY_OF_WEEK != '7')
      run: |
        python file2_lotto_service.py --mode gen

    - name: 결과 파일 저장 (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # 1. 보안을 위해 키 파일 먼저 삭제 (로그에 남지 않게)
        rm -f lotto_key.json
        
        # 2. 변경된 데이터 추가
        git add *.json *.csv
        
        # 3. 변경 사항이 있을 때만 커밋 및 푸시
        if ! git diff --staged --quiet; then
          git commit -m "Update lotto data [skip ci]"
          git push origin main
        else
          echo "No changes to commit"
        fi
